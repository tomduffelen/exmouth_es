name: Check space files

on:
  pull_request:
    paths:
      - 'data/**'
      - 'assets/**'
      - 'tools/**'
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate every space file
        run: node tools/validate.mjs
